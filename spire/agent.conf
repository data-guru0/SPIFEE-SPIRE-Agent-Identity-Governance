agent {
  data_dir = "/opt/spire/data/agent"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  trust_domain = "ai-governance.demo"
  socket_path = "/run/spire/sockets/agent.sock"   # the Workload API
  insecure_bootstrap = true
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "memory" {
    plugin_data {}
  }
  # Workload attestation: identify the calling process by its kernel-reported Unix UID.
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
